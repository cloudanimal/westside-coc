name: Keep Supabase awake

# Free-tier Supabase projects pause after ~7 days with no activity.
# This pings the project once a day so it never goes to sleep.
# The key below is the PUBLISHABLE (anon) key — safe to be public; it is
# already embedded in the members app's page source.

on:
  schedule:
    - cron: "0 12 * * *"     # daily at 12:00 UTC (about 7-8am US Eastern)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (auth + database)
        run: |
          URL="https://hpdikwatyhnctfhrrslh.supabase.co"
          KEY="sb_publishable_H7XQ6LPVRSQjC2I36iwbMA_TTrLr2VT"

          echo "Auth health check:"
          curl -sS -o /dev/null -w "  HTTP %{http_code}\n" "$URL/auth/v1/health" -H "apikey: $KEY"

          echo "Database read (this is what keeps Postgres active):"
          curl -sS -o /dev/null -w "  HTTP %{http_code}\n" \
            "$URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY"

          echo "Done."
